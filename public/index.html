<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TARDIS Archive</title><link rel="stylesheet" href="/style.css"></head><body>
<main><h1>TARDIS Archive</h1><p>Et lille undervisningseksempel i Express og MongoDB. Data gemmes lokalt.</p>
<section><h2>Karakterer i databasen</h2><form id="search"><label for="name">Søg efter navn</label><input id="name" placeholder="Doctor"><button>Søg</button><button type="button" id="all">Vis alle</button></form><p id="message" role="status"></p><ul id="characters"></ul></section>
<section><h2>Opret en karakter</h2><form id="create"><label>Navn <input name="name" required></label><label>Skuespiller <input name="actor" required></label><label>Art <input name="species" required value="Time Lord"></label><label>Første optræden (år) <input name="firstAppearance" type="number" min="1963" required value="2005"></label><label>Hjemplanet <input name="homePlanet" required value="Gallifrey"></label><label>Beskrivelse <input name="description"></label><label><input type="checkbox" name="isFavorite"> Favorit</label><button type="submit">Opret</button></form></section>
<section><h2>Ekstern integration</h2><p>Hent Doctor Who-relaterede serier fra TVmaze (gemmes ikke i MongoDB).</p><button id="external">Søg på TVmaze</button><ul id="shows"></ul><small>Eksterne data: <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a> (CC BY-SA).</small></section>
</main><script type="module" src="/app.js"></script></body></html>
